{% extends "store/base.html" %}
{% block title %}Registro · Sport Zone{% endblock %}
{% block content %}

<style>
  .registro-card { border: 0; border-top: 5px solid var(--sport-green); overflow: hidden; }
  .registro-header {
    background: linear-gradient(135deg, var(--sport-navy) 0%, var(--sport-green-dark) 100%);
    color: #fff;
    border-bottom: 4px solid var(--sport-orange);
  }
  .registro-header p { color: rgba(255,255,255,.8); }
  .form-control:focus, .form-select:focus {
    border-color: var(--sport-green);
    box-shadow: 0 0 0 .2rem rgba(0,196,106,.25);
  }
  .registro-link { color: var(--sport-green-dark); font-weight: 600; }
  .registro-link:hover { color: var(--sport-orange); }
</style>

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card registro-card shadow-sm">
      <div class="registro-header p-4">
        <h3 class="mb-1">🏅 Únete al equipo</h3>
        <p class="mb-0">Crea tu cuenta y empieza a comprar.</p>
      </div>
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" minlength="3" maxlength="50" value="{{ form.username|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="full_name" class="form-label">Nombre completo <span class="text-muted">(opcional)</span></label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ form.full_name|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ form.email|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="72" required>
            <div class="form-text">Entre 6 y 72 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">Repite la contraseña</label>
            <input type="password" class="form-control" id="password2" name="password2" required>
          </div>
          <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select class="form-select" id="rol" name="rol" required>
              {% for valor, nombre in roles.items %}
                <option value="{{ valor }}" {% if form.rol == valor %}selected{% endif %}>{{ nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <button class="btn btn-primary w-100" type="submit">Registrarme</button>
        </form>
        <p class="text-center mt-3 mb-0 small">¿Ya eres parte del equipo? <a class="registro-link" href="{% url 'login' %}">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
